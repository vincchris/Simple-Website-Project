<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Personal Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <div class="logo">
      <p>My PV</p>
    </div>

    <ul>
      <li>Home</li>
      <li>About</li>
    </ul>
  </nav>

  <div class="intro">
    <p>Hello, I'm Vincent C Web Developer</p>
    <button id="HeroBtn">[Say Hello]</button>
    <p id="result"></p>
  </div>

  <div class="about">
    <h1>I can Destroy The World</h1>
  </div>

  <div class="card-container">
    <div class="card">
      <div class="card-content">
        <h1>HTML</h1>
        <p>Beginner</p>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <h1>CSS</h1>
        <p>Beginner</p>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <h1>JavaScript</h1>
        <p>Beginner</p>
      </div>
    </div>
  </div>

  <form id="contactForm">
    <h2>Contact Us</h2>
    <p class="form-description">Send us a message</p>

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name">
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Enter your message"></textarea>
    </div>

    <button type="submit" id="submit">Send Message</button>

    <p id="resultForm"></p>
  </form>
</div>

</body>
  <script src="script.js"></script>
</html>
